<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Turbo Track Rally</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="ui">
    <!-- MAIN MENU -->
    <section id="screen-menu" class="screen">
      <div class="panel menu-panel">
        <h1 class="title">Turbo Track Rally</h1>
        <p class="subtitle">Pick a car. Pick a track. Beat the clock.</p>
        <button class="btn btn-primary" id="btn-play">▶ Play</button>
        <button class="btn" id="btn-garage">🚗 Garage</button>
        <div class="menu-footer">
          <span id="coin-display" class="coin-badge">🪙 0</span>
          <button class="btn btn-link" id="btn-reset">Reset progress</button>
        </div>
      </div>
    </section>

    <!-- GARAGE -->
    <section id="screen-garage" class="screen hidden">
      <div class="panel wide-panel">
        <div class="panel-header">
          <h2>Garage</h2>
          <span id="garage-coin-display" class="coin-badge">🪙 0</span>
        </div>
        <div id="car-grid" class="card-grid"></div>
        <div class="panel-footer">
          <button class="btn" id="btn-garage-back">← Back</button>
        </div>
      </div>
    </section>

    <!-- TRACK SELECT -->
    <section id="screen-select" class="screen hidden">
      <div class="panel wide-panel">
        <div class="panel-header">
          <h2>Choose a Track</h2>
          <div class="selected-car-chip" id="selected-car-chip"></div>
        </div>
        <div id="track-list" class="card-grid"></div>
        <div class="panel-footer">
          <button class="btn" id="btn-select-back">← Back</button>
        </div>
      </div>
    </section>

    <!-- RACE HUD -->
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-timer" id="hud-timer">0.00</div>
        <button class="hud-pause" id="btn-pause">⏸</button>
      </div>
      <div class="hud-toast" id="hud-toast"></div>
    </div>

    <div id="touch-controls">
      <button class="touch-btn touch-brake" id="touch-brake">◀</button>
      <button class="touch-btn touch-gas" id="touch-gas">▶</button>
      <button class="touch-btn touch-tilt touch-tilt-up" id="touch-tilt-up">⤴</button>
      <button class="touch-btn touch-tilt touch-tilt-down" id="touch-tilt-down">⤵</button>
    </div>

    <!-- PAUSE -->
    <section id="screen-pause" class="screen hidden overlay-screen">
      <div class="panel">
        <h2>Paused</h2>
        <button class="btn btn-primary" id="btn-resume">▶ Resume</button>
        <button class="btn" id="btn-restart">↻ Restart</button>
        <button class="btn" id="btn-pause-menu">☰ Menu</button>
      </div>
    </section>

    <!-- RESULTS -->
    <section id="screen-results" class="screen hidden overlay-screen">
      <div class="panel">
        <h2 id="results-title">Finished!</h2>
        <div class="results-time" id="results-time">0.00s</div>
        <div class="results-stars" id="results-stars">☆☆☆</div>
        <div class="results-coins" id="results-coins">+0 🪙</div>
        <button class="btn btn-primary" id="btn-retry">↻ Retry</button>
        <button class="btn" id="btn-next-track">Next Track →</button>
        <button class="btn" id="btn-results-menu">☰ Menu</button>
      </div>
    </section>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
